[settings]
lockfile = true

[tools]
gam = "latest"
shellcheck = "latest"

# The org's Workspace, not a developer's: these belong in git.
[env]
GAM_ADMIN_USER = "master@cyccommunitysailing.org"
GAM_PROJECT_ID = "gam-project-sby17"
GAM_SERVICE_ACCOUNT_NAME = "gam-project-sby17"
GAM_SPREADSHEET_ID = "1iSa8Ff07VizzaKnlpMWWnVx0GORi4pnAXhrH17JL8qE"

[tasks.install]
description = "Install the pinned tools"
run = "mise install"

[tasks.check]
description = "Lint the shell scripts"
run = "shellcheck scripts/*"

[tasks.ci]
description = "Run all checks"
depends = ["check"]

[tasks.use-project]
description = "Use the existing GAM project"
run = 'gam use project admin "${GAM_ADMIN_USER}" project "${GAM_PROJECT_ID}" saname "${GAM_SERVICE_ACCOUNT_NAME}"'

[tasks.check-service-account]
description = "Verify the service account has the required API scopes"
run = 'gam user "${GAM_ADMIN_USER}" check serviceaccount'

[tasks.auth]
description = "Log in as the admin user"
run = ['gam oauth create "${GAM_ADMIN_USER}"', "gam info domain"]

[tasks.export]
description = "Export group information to the spreadsheet"
run = ["./scripts/export-groups", "./scripts/export-group-members"]
